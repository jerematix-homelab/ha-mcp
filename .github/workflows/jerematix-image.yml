name: Build Jerematix image

on:
  push:
    tags:
      - "jerematix-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jerematix-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jerematix-homelab/ha-mcp:${{ github.ref_name }}
            ghcr.io/jerematix-homelab/ha-mcp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jerematix-homelab/ha-mcp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          provenance: mode=max
          sbom: true
